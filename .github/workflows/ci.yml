# Ubicación en el repo: .github/workflows/ci.yml
#
# Este flujo se ejecuta en los servidores de GitHub cada vez que abres un PR
# hacia main o haces push a main. Si algo falla, el PR queda marcado en rojo.

name: CI # Nombre que aparece en la pestaña Actions y en el badge del README

on: # Eventos que disparan este flujo
  pull_request: # Cada vez que abras o actualices un PR...
    branches: [main] # ...que apunte a la rama main
  push: # Y también cuando entre código directamente a main
    branches: [main]

jobs: # Un flujo puede tener varios trabajos; aquí solo necesitas uno
  calidad:
    runs-on: ubuntu-latest # Máquina virtual limpia que GitHub crea y destruye en cada ejecución

    steps:
      # --- Preparación -----------------------------------------------------
      - name: Descargar el código
        uses: actions/checkout@v4 # Acción oficial: clona tu repo dentro de la máquina virtual

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # La misma versión que usa tu contenedor
          cache: pip # Guarda las dependencias entre ejecuciones para que el CI sea más rápido

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r fastapi/requirements.txt
          pip install ruff pytest   # Herramientas que solo se usan en CI, no en producción

      # --- Verificaciones --------------------------------------------------
      - name: Revisar estilo y errores comunes (linter)
        run: ruff check fastapi/ # Detecta imports sin usar, variables muertas, errores de sintaxis

      - name: Revisar formato
        run: ruff format --check fastapi/ # Falla si el código no está formateado de forma consistente

      - name: Ejecutar pruebas
        run: pytest fastapi/tests -v # Aquí viven las pruebas del motor difuso

      # --- Validación de la infraestructura --------------------------------
      - name: Validar docker-compose
        run: |
          cp .env.example .env     # Usa el ejemplo como .env falso solo para esta validación
          docker compose config --quiet
        # Esto hace dos cosas a la vez: verifica que el docker-compose.yml sea
        # válido, y comprueba que .env.example tenga TODAS las variables que el
        # compose necesita. Si te falta una, el CI se pone rojo.